# Preview images for testing a branch before it is merged or released.
#
# Builds the root Dockerfile (self-contained: jellyfin-web and the ffmpeg runtime
# from source, like the release job) and pushes it to this repository's GHCR
# package as
#   ghcr.io/<owner>/<repo>:<branch>        (slashes become dashes)
#   ghcr.io/<owner>/<repo>:sha-<short sha>
# then boots the pushed image once. It never touches `:latest` or a version tag:
# those stay the release workflow's.
#
# Runs on pushes to agent/feature branches (`claude/**`, `preview/**`) and on
# demand (Actions → preview-image → Run workflow) for any branch.
name: preview-image

on:
  push:
    branches: ["claude/**", "preview/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: free runner disk (~25 GB of preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: compute image tags
        id: tags
        run: |
          set -eu
          # GHCR image names must be lower case.
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          branch="$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          short="$(echo "$GITHUB_SHA" | cut -c1-7)"
          {
            echo "image=$image"
            echo "primary=$image:$branch"
            echo "tags=$image:$branch,$image:sha-$short"
            echo "version=$branch-$short"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SERVICE_VERSION=${{ steps.tags.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
      - name: boot the pushed image
        env:
          IMG: ${{ steps.tags.outputs.primary }}
        run: |
          set -eu
          docker pull "$IMG"
          docker run -d --name smoke -p 8096:8096 "$IMG"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8096/health/ready 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8096/health/ready > /dev/null || { echo "never became ready"; docker logs smoke; exit 1; }
          curl -fsS http://127.0.0.1:8096/System/Info/Public
          echo
          curl -fsS -o /dev/null http://127.0.0.1:8096/web/ || { echo "/web not served"; docker logs smoke; exit 1; }
          docker rm -f smoke
          {
            echo "### Preview image"
            echo
            echo '```'
            echo "docker pull $IMG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
